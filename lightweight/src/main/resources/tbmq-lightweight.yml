tbmq:
  netty:
    port: "${TBMQ_MQTT_PORT:1883}"
    max-connections: "${TBMQ_MAX_CONNECTIONS:10000}"
    boss-threads: "${TBMQ_NETTY_BOSS_THREADS:1}"
    worker-threads: "${TBMQ_NETTY_WORKER_THREADS:0}"
  storage:
    rocksdb:
      path: "${TBMQ_ROCKSDB_PATH:/data/rocksdb}"
  actors:
    throughput: "${TBMQ_ACTOR_THROUGHPUT:10}"
    scheduler-pool-size: "${TBMQ_ACTOR_SCHEDULER_POOL_SIZE:1}"
    max-init-attempts: "${TBMQ_ACTOR_MAX_INIT_ATTEMPTS:10}"
  mqtt:
    max-payload-size: "${TBMQ_MQTT_MAX_PAYLOAD_SIZE:268435456}"
    max-client-id-length: "${TBMQ_MQTT_MAX_CLIENT_ID_LENGTH:128}"
    keep-alive-max: "${TBMQ_MQTT_KEEP_ALIVE_MAX:600}"
  mqtt5:
    topic-alias-max: "${TBMQ_TOPIC_ALIAS_MAX:10}"
    receive-maximum: "${TBMQ_RECEIVE_MAXIMUM:65535}"
    min-topic-alias-length: "${TBMQ_MIN_TOPIC_ALIAS_LENGTH:5}"
  dispatch:
    queue-capacity: "${TBMQ_DISPATCH_QUEUE_CAPACITY:100000}"
    consumer-threads: "${TBMQ_DISPATCH_CONSUMER_THREADS:2}"
  subscription-trie:
    wait-for-clear-lock-ms: "${TBMQ_SUBSCRIPTION_TRIE_CLEAR_LOCK_MS:5000}"
  retain-msg-trie:
    wait-for-clear-lock-ms: "${TBMQ_RETAIN_MSG_TRIE_CLEAR_LOCK_MS:5000}"
  security:
    anonymous-enabled: "${TBMQ_SECURITY_ANONYMOUS_ENABLED:false}"
  tls:
    enabled: "${TBMQ_TLS_ENABLED:false}"
    port: "${TBMQ_MQTTS_PORT:8883}"
    cert-path: "${TBMQ_TLS_CERT_PATH:}"
    key-path: "${TBMQ_TLS_KEY_PATH:}"
    client-auth: "${TBMQ_TLS_CLIENT_AUTH:NONE}"
    trust-cert-path: "${TBMQ_TLS_TRUST_CERT_PATH:}"
  ws:
    enabled: "${TBMQ_WS_ENABLED:true}"
    port: "${TBMQ_WS_PORT:8084}"
    sub-protocols: "${TBMQ_WS_SUB_PROTOCOLS:mqttv3.1,mqtt}"
    max-content-length: "${TBMQ_WS_MAX_CONTENT_LENGTH:65536}"
  wss:
    enabled: "${TBMQ_WSS_ENABLED:false}"
    port: "${TBMQ_WSS_PORT:8085}"
    sub-protocols: "${TBMQ_WSS_SUB_PROTOCOLS:mqttv3.1,mqtt}"
    max-content-length: "${TBMQ_WSS_MAX_CONTENT_LENGTH:65536}"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: "always"
  metrics:
    enable:
      jvm: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: "${TBMQ_HTTP_PORT:8083}"
  shutdown: "graceful"

spring:
  cache:
    type: caffeine
  application:
    name: tbmq-lightweight
  lifecycle:
    timeout-per-shutdown-phase: "10s"
